{% extends "base.html" %}
{% from "macros.html" import form_actions %}
{% block title %}{{ "Edit" if firearm else "Add" }} Firearm - Reloading Tracker{% endblock %}
{% block content %}
<h2>{{ "Edit" if firearm else "Add" }} Firearm</h2>
<div class="card mt-3">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="make" class="form-label">Make / Manufacturer <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="make" name="make" value="{{ firearm.make if firearm else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label for="model" class="form-label">Model <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="model" name="model" value="{{ firearm.model if firearm else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label for="serial_number" class="form-label">Serial Number</label>
                    <input type="text" class="form-control" id="serial_number" name="serial_number" value="{{ firearm.serial_number if firearm and firearm.serial_number else '' }}">
                </div>
                <div class="col-md-4">
                    <label for="caliber_id" class="form-label">Caliber <span class="text-danger">*</span></label>
                    <select class="form-select" id="caliber_id" name="caliber_id" required>
                        <option value="">Select caliber...</option>
                        {% for c in calibers %}
                        <option value="{{ c.id }}" {% if firearm and firearm.caliber_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="barrel_length" class="form-label">Barrel Length (in)</label>
                    <input type="number" step="0.01" class="form-control" id="barrel_length" name="barrel_length" value="{{ '%.2f'|format(firearm.barrel_length) if firearm and firearm.barrel_length else '' }}">
                </div>
                <div class="col-md-6">
                    <label for="twist_rate" class="form-label">Twist Rate</label>
                    <input type="text" class="form-control" id="twist_rate" name="twist_rate" value="{{ firearm.twist_rate if firearm and firearm.twist_rate else '' }}" placeholder="e.g. 1:10">
                </div>
                <div class="col-12">
                    <label for="notes" class="form-label">Notes</label>
                    <textarea class="form-control" id="notes" name="notes" rows="3">{{ firearm.notes if firearm and firearm.notes else '' }}</textarea>
                </div>
            </div>
            {{ form_actions(url_for('firearms.index')) }}
        </form>
    </div>
</div>
{% endblock %}
